# tmux config — symlinked to ~/.config/tmux/tmux.conf
# Reload after editing: prefix + r

# ── Behaviour ────────────────────────────────────────────────────────────────

# Esc reaches Neovim immediately instead of after 500ms
set -sg escape-time 10
# Lets Neovim notice focus changes (autoread, etc.)
set -g focus-events on
# 24-bit colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Clipboard: let apps (Neovim, remote shells) copy to the system clipboard via
# OSC 52, and forward it to the outer terminal — works over SSH too.
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

set -g history-limit 50000

# prefix + r: reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "█▓░ tmux.conf reloaded"

# ── Appearance: Catppuccin Mocha, styled after xero/dotfiles ─────────────────
# Shade-block fades (░▒▓), box-drawing meters (━─) and geometric shapes (◇◈)
# only: these are in practically every monospace font, no Nerd Font needed.
#
# Palette
#   crust #11111b  mantle #181825  base #1e1e2e  surface0 #313244
#   surface1 #45475a  overlay0 #6c7086  subtext0 #a6adc8  text #cdd6f4
#   blue #89b4fa  sapphire #74c7ec  lavender #b4befe  yellow #f9e2af

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 120

# Left: mode indicator + session name
#   ◇ normal   ◈ on blue = prefix pressed   ◈ on yellow = copy mode
set -g status-left "#{?client_prefix,#[bg=#89b4fa fg=#11111b] ◈ ,#{?pane_in_mode,#[bg=#f9e2af fg=#11111b] ◈ ,#[bg=default fg=#89b4fa] ◇ }}#[bg=default fg=#a6adc8] #S "

# Windows: block that fades in from the background (▓░) then the name.
# Current window is blue, others surface grey. ◆ marks a zoomed pane.
set -g window-status-separator ""
set -g window-status-format " #[bg=#313244,fg=#1e1e2e]▓░#[fg=#a6adc8] #I #W#{?window_zoomed_flag, ◆,} "
set -g window-status-current-format " #[bg=#89b4fa,fg=#1e1e2e]▓░#[fg=#11111b,bold] #I #W#{?window_zoomed_flag, ◆,} "
set -g window-status-activity-style "fg=#f9e2af"
set -g window-status-bell-style "fg=#f38ba8,bold"

# Right: CPU / memory / disk meters, time and date (see status.sh)
set -g status-right "#(~/.config/tmux/status.sh #{client_width})"

# Panes: heavy borders, active one in blue; inactive panes slightly dimmed
set -g pane-border-lines heavy
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g window-style "bg=#181825"
set -g window-active-style "bg=default"

# Messages and command prompt
set -g message-style "bg=#89b4fa,fg=#11111b"
set -g message-command-style "bg=#313244,fg=#89b4fa"

# Copy-mode selection and search matches
set -g mode-style "bg=#45475a,fg=#89b4fa"
set -g copy-mode-match-style "bg=#313244,fg=#cdd6f4"
set -g copy-mode-current-match-style "bg=#74c7ec,fg=#11111b"

# prefix + q pane numbers, prefix + t clock
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#45475a"
set -g clock-mode-colour "#89b4fa"

# Session / window tree (prefix + s, prefix + w): same commands as tmux's
# defaults (choose-tree -Zs / -Zw), only with a styled row format.
# tmux prints each name itself; the format adds the decorations and details:
#   ▓░ session + window count   ░ window + running program   ◇ active   ◆ attached
%hidden TREE_FMT="#{?pane_format,#[fg=#cdd6f4]#{pane_current_command}#{?pane_active, #[fg=#89b4fa]◇,},#{?window_format,#[fg=#74c7ec]░ #[fg=#cdd6f4]#{pane_current_command}#[fg=#6c7086]  #{window_panes} #{?#{==:#{window_panes},1},pane,panes}#{?window_active, #[fg=#89b4fa]◇,},#[fg=#89b4fa]▓░ #[fg=#6c7086]#{session_windows} #{?#{==:#{session_windows},1},window,windows}#{?session_attached, #[fg=#a6e3a1]◆ attached,}}}"
bind s choose-tree -Zs -F "$TREE_FMT"
bind w choose-tree -Zw -F "$TREE_FMT"
