# tmux config — symlinked to ~/.config/tmux/tmux.conf
# Reload after editing: prefix + r

# ── Behaviour ────────────────────────────────────────────────────────────────

# Esc reaches Neovim immediately instead of after 500ms
set -sg escape-time 10
# Lets Neovim notice focus changes (autoread, etc.)
set -g focus-events on
# 24-bit colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Clipboard: let apps (Neovim, remote shells) copy to the system clipboard via
# OSC 52, and forward it to the outer terminal — works over SSH too.
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

set -g history-limit 50000

# prefix + r: reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Appearance: Catppuccin Mocha, lualine-style (matches Neovim) ─────────────
# Palette
#   crust #11111b  mantle #181825  base #1e1e2e  surface0 #313244
#   surface1 #45475a  overlay0 #6c7086  text #cdd6f4
#   blue #89b4fa  mauve #cba6f7  red #f38ba8  yellow #f9e2af  green #a6e3a1

set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80

# Left: session name, like lualine's mode block. Colour shows tmux "mode":
#   blue = normal, red = prefix pressed, yellow = copy mode
%hidden MODE_BG="#{?client_prefix,#f38ba8,#{?pane_in_mode,#f9e2af,#89b4fa}}"
set -g status-left "#[fg=#11111b,bg=$MODE_BG,bold]  #S #[fg=$MODE_BG,bg=#181825,nobold] "

# Windows: current one is a mauve block, others are dim text. 󰊓 = zoomed pane
set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086,bg=#181825] #I #W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-current-format "#[fg=#181825,bg=#cba6f7]#[fg=#11111b,bg=#cba6f7,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#cba6f7,bg=#181825,nobold]"
set -g window-status-activity-style "fg=#f9e2af,bg=#181825"
set -g window-status-bell-style "fg=#f38ba8,bg=#181825,bold"

# Right: host (handy when SSH'd into several machines), date, time
set -g status-right "#[fg=#313244,bg=#181825]#[fg=#cdd6f4,bg=#313244] 󰒋 #h #[fg=#45475a,bg=#313244]#[fg=#cdd6f4,bg=#45475a] 󰃭 %a %b %d #[fg=#89b4fa,bg=#45475a]#[fg=#11111b,bg=#89b4fa,bold] 󰥔 %H:%M "

# Pane borders: active pane outlined in blue
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines single

# Messages, command prompt, copy-mode selection, misc
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#6c7086"
set -g clock-mode-colour "#89b4fa"
