# tmux config — symlinked to ~/.config/tmux/tmux.conf
# Reload after editing: prefix + r

# ── Behaviour ────────────────────────────────────────────────────────────────

# Esc reaches Neovim immediately instead of after 500ms
set -sg escape-time 10
# Lets Neovim notice focus changes (autoread, etc.)
set -g focus-events on
# 24-bit colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Clipboard: let apps (Neovim, remote shells) copy to the system clipboard via
# OSC 52, and forward it to the outer terminal — works over SSH too.
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

set -g history-limit 50000

# prefix + r: reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Appearance: Catppuccin Mocha "rice" bar ──────────────────────────────────
# Floating rounded pills on a transparent bar, blue accents, a spacer row
# between the panes and the bar. Needs a Nerd Font (same as Neovim).
#
# Palette
#   crust #11111b  mantle #181825  base #1e1e2e  surface0 #313244
#   surface1 #45475a  overlay0 #6c7086  subtext0 #a6adc8  text #cdd6f4
#   blue #89b4fa  sapphire #74c7ec  sky #89dceb  lavender #b4befe
#   red #f38ba8  yellow #f9e2af
#
# Pill anatomy:  [ICON on accent][ text on surface0 ]

# Transparent bar: pills float over your terminal background
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-position bottom
set -g status-justify centre
set -g status-interval 15
set -g status-left-length 60
set -g status-right-length 80

# Two status rows: row 0 is an empty spacer, row 1 is the actual bar.
# (Copies tmux's default bar format into row 1; reset first so reloads work.)
set -g status 2
set -gu status-format
run-shell 'tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")" \; set -g "status-format[0]" ""'

# Left pill: session. Accent shows tmux mode:
#   blue = normal, red = prefix pressed, yellow = copy mode
%hidden ACCENT="#{?client_prefix,#f38ba8,#{?pane_in_mode,#f9e2af,#89b4fa}}"
%hidden ICON="#{?client_prefix,󰌌,#{?pane_in_mode,󰆏,}}"
set -g status-left "#[fg=$ACCENT,bg=default]#[fg=#11111b,bg=$ACCENT,bold]$ICON #[fg=#cdd6f4,bg=#313244,bold] #S #[fg=#313244,bg=default,nobold]"

# Windows (centred, like workspaces in a bar). Current = blue number block +
# brighter name; others = dim. 󰊓 marks a zoomed pane.
set -g window-status-separator " "
set -g window-status-format "#[fg=#45475a,bg=default]#[fg=#a6adc8,bg=#45475a]#I #[fg=#6c7086,bg=#313244] #W#{?window_zoomed_flag, 󰊓,} #[fg=#313244,bg=default]"
set -g window-status-current-format "#[fg=#89b4fa,bg=default]#[fg=#11111b,bg=#89b4fa,bold]#I #[fg=#cdd6f4,bg=#45475a,bold] #W#{?window_zoomed_flag, 󰊓,} #[fg=#45475a,bg=default,nobold]"
set -g window-status-activity-style "fg=#f9e2af,bg=default"
set -g window-status-bell-style "fg=#f38ba8,bg=default,bold"

# Right pills: host, date, time — each with its own shade of blue
set -g status-right "#[fg=#74c7ec,bg=default]#[fg=#11111b,bg=#74c7ec]󰒋 #[fg=#cdd6f4,bg=#313244] #h #[fg=#313244,bg=default] #[fg=#b4befe,bg=default]#[fg=#11111b,bg=#b4befe]󰃭 #[fg=#cdd6f4,bg=#313244] %a %d #[fg=#313244,bg=default] #[fg=#89b4fa,bg=default]#[fg=#11111b,bg=#89b4fa]󰥔 #[fg=#cdd6f4,bg=#313244,bold] %H:%M #[fg=#313244,bg=default,nobold]"

# Pane borders: thin, active pane traced in blue
set -g pane-border-lines single
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Messages / command prompt: blue-accented pill style
set -g message-style "bg=#313244,fg=#89b4fa,bold"
set -g message-command-style "bg=#313244,fg=#b4befe,bold"

# Copy-mode selection and search matches
set -g mode-style "bg=#89b4fa,fg=#11111b"
set -g copy-mode-match-style "bg=#45475a,fg=#cdd6f4"
set -g copy-mode-current-match-style "bg=#74c7ec,fg=#11111b"

# prefix + q pane numbers, prefix + t clock
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#45475a"
set -g clock-mode-colour "#89b4fa"
